name: Brainrot Studio Extreme Video QA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run 2.5M extreme video pipeline stress test
        run: npm run qa:stress
        env:
          QA_CASES: 2500000
      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extreme-video-qa-report
          path: qa-report.json
          if-no-files-found: ignore
